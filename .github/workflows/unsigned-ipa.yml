name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Level-1 only. qemu-tcti has nested roms/edk2 submodules that are
          # NOT needed to build x86_64-softmmu, and some (subhook) are dead repos.
          submodules: true

      - name: Install host build tools
        run: |
          brew install bison gettext glib libgpg-error meson ninja
          python3 -m pip install six pyparsing

      - name: Build QEMU and native dependencies
        run: |
          export PATH="/usr/local/opt/bison/bin:/usr/local/opt/gettext/bin:$PATH"
          ./build_dependencies.sh

      - name: Build unsigned app
        run: |
          xcodebuild -workspace tctiSH.xcworkspace \
            -scheme tctiSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/tctiSH.app" Payload/
          ditto -c -k --keepParent Payload tctiSH-unsigned.ipa
          ls -la tctiSH-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tctiSH-unsigned-ipa
          path: tctiSH-unsigned.ipa
          if-no-files-found: error

      - name: Publish IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tctiSH-unsigned.ipa
          tag_name: unsigned-${{ github.run_number }}
          name: "tctiSH unsigned IPA #${{ github.run_number }}"
          prerelease: true
